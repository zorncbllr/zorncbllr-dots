# Defaults (monochrome). sddm/install-theme.sh overwrites the colour values with the
# current quickshell palette, copies the current wallpaper to background.png, and bundles
# the shapes library and Google Sans Flex.
[General]
background=background.png
timeFormat=h:mm ap
font=Rubik
fontExpressive=Space Grotesk
iconFont=Material Symbols Rounded
statusText=Locked
cookieSides=14
blur=1.0
zoom=1.1
dim=0.30
surface=#131313
surfaceContainer=#1f1f1f
surfaceContainerHigh=#2a2a2a
onSurface=#e2e2e2
onSurfaceVariant=#c6c6c6
outline=#919191
primary=#ffffff
onPrimary=#1b1b1b
primaryContainer=#d4d4d4
secondary=#c6c6c6
secondaryContainer=#474747
onSecondaryContainer=#e2e2e2
tertiary=#e2e2e2
tertiaryContainer=#919191
onTertiaryContainer=#000000
error=#ffb4ab

# Optional:
#   statusText=            hide the "Locked" pill
#   showPowerAlways=true   show sleep/reboot/power even if SDDM reports them unavailable
#   previewText=abcdef     type characters into the password field (preview only)
#   previewShot=/tmp/x.png save a screenshot of the theme and quit (headless rendering)
