# Defaults (monochrome). sddm/install-theme.sh overwrites the colour values with the
# current quickshell palette and copies the current wallpaper to background.png.
[General]
background=background.png
timeFormat=h:mm ap
dateFormat="dddd, d MMMM"
font=Rubik
iconFont=Material Symbols Rounded
blur=1.0
dim=0.30
surfaceContainer=#1f1f1f
surfaceContainerHigh=#2a2a2a
onSurface=#e2e2e2
onSurfaceVariant=#c6c6c6
primary=#ffffff
onPrimary=#1b1b1b
error=#ffb4ab

# Preview/testing only (not set by default):
#   showPowerAlways=true   show sleep/reboot/power even if SDDM reports they are unavailable
#   previewShot=/tmp/x.png save a screenshot of the theme and quit (headless rendering)
