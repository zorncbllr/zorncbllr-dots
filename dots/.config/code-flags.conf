# Flags appended to argv by /usr/bin/code on every launch (the wrapper reads
# this file and does `exec /usr/share/code/bin/code "$@" $CODE_USER_FLAGS`).
#
# Keep this list to Electron's *own* switches. Anything Chromium/Ozone-specific
# makes code print on every start:
#   Warning: 'x' is not in the list of known options, but still passed to Electron/Chromium.
# and does nothing here anyway, since the official VS Code build (Electron 43 /
# Chromium 150) is not compiled with ozone or GTK4 support.
--password-store=gnome-libsecret

# Removed: these came from chrome-flags.conf, which *is* an ozone/GTK4 build.
#   --ozone-platform-hint=wayland  -> no ozone support in this build
#   --gtk-version=4                -> code links GTK3
#   --enable-wayland-ime           -> only meaningful for an ozone build
#   --ignore-gpu-blocklist         -> AMD/Mesa GPU is not on the blocklist
#   --enable-features=TouchpadOverscrollHistoryNavigation
#                                   -> on by default since Chromium 105
# Re-add any of them below if you ever need to debug; expect the warning back.